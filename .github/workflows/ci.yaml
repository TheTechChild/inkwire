name: ci

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-anchors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup env
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test the checker
        run: node --test scripts/map-anchor-check.test.mjs
      - name: Check MAP.md anchors
        run: node scripts/map-anchor-check.mjs --all

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Enable corepack
        run: npm install -g corepack && corepack enable
      - name: Setup env
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
      - name: Install deps
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Type Check
        run: yarn typecheck

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Enable corepack
        run: npm install -g corepack && corepack enable
      - name: Setup env
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
      - name: Install deps
        run: yarn install --immutable
      - name: Test
        run: yarn test
